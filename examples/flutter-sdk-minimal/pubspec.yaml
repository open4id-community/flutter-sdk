name: flutter_sdk_minimal
description: Minimal Flutter example using the open4id_sdk headless Dart API only (no UI widgets).
version: 0.3.2+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  open4id_sdk:
    path: ../../sdks/flutter/open4id_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
