name: flutter_sdk_minimal_ui
description: Minimal Flutter example with a game-built UI on top of the open4id_sdk headless API (no SDK-provided UI widgets).
version: 0.3.2+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  open4id_sdk: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
